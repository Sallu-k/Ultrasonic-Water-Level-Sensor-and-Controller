<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="1020" height="520" fill="#ffffff"/>
<defs>
  <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 Z" fill="#111"/>
  </marker>
</defs>

<text x="34" y="42" font-size="22" font-weight="bold" fill="#111">Hysteresis control cycle</text>
<text x="34" y="64" font-size="13" fill="#666">Tank level over time (top) and the pump command it produces (bottom)</text>
<line x1="34" y1="78" x2="986" y2="78" stroke="#111" stroke-width="1.5"/>

<!-- level plot frame: y=100 -> 100 %, y=340 -> 0 % (2.4 px per %) -->
<line x1="110" y1="100" x2="110" y2="344" stroke="#111" stroke-width="1.5"/>
<line x1="106" y1="340" x2="960" y2="340" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<text x="100" y="104" font-size="12" fill="#333" text-anchor="end">100 %</text>
<text x="100" y="344" font-size="12" fill="#333" text-anchor="end">0 %</text>
<text x="46" y="226" font-size="12" fill="#333" transform="rotate(-90 46 226)" text-anchor="middle">level</text>

<!-- deadband -->
<rect x="110" y="124" width="840" height="192" fill="#eef6f9"/>
<text x="946" y="152" font-size="12" fill="#2c7fb8" text-anchor="end">hold band: no new decision</text>

<!-- thresholds -->
<line x1="110" y1="124" x2="950" y2="124" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="100" y="128" font-size="12" fill="#c0392b" text-anchor="end">90 %</text>
<text x="946" y="118" font-size="12" fill="#c0392b" text-anchor="end">OFF threshold</text>
<line x1="110" y1="316" x2="950" y2="316" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="100" y="320" font-size="12" fill="#c0392b" text-anchor="end">10 %</text>
<text x="920" y="334" font-size="12" fill="#c0392b" text-anchor="end">ON threshold</text>

<!-- level trace: start 30 %, drain to 10 %, fill to 90 %, drain again, ripple mid-band -->
<polyline fill="none" stroke="#111" stroke-width="2.5"
  points="110,268 250,318 430,124 470,124 650,244 670,238 690,250 710,236 730,248 750,240 770,252 790,242 810,254 950,318"/>

<!-- event markers -->
<circle cx="250" cy="318" r="5" fill="#c0392b"/>
<text x="264" y="334" font-size="11.5" fill="#333" text-anchor="start">&lt; 10 % → ON</text>
<circle cx="430" cy="124" r="5" fill="#c0392b"/>
<text x="430" y="114" font-size="11.5" fill="#333" text-anchor="middle">≥ 90 % → OFF</text>
<text x="730" y="222" font-size="11.5" fill="#333" text-anchor="middle">ripple around 50 %: pump holds</text>
<circle cx="950" cy="318" r="5" fill="#c0392b"/>

<!-- pump state strip -->
<text x="100" y="404" font-size="12" fill="#333" text-anchor="end">pump</text>
<rect x="110" y="382" width="140" height="34" fill="#f4f4f4" stroke="#999"/>
<text x="180" y="404" font-size="12" fill="#555" text-anchor="middle">OFF</text>
<rect x="250" y="382" width="180" height="34" fill="#2c7fb8"/>
<text x="340" y="404" font-size="12.5" font-weight="bold" fill="#fff" text-anchor="middle">ON (filling)</text>
<rect x="430" y="382" width="520" height="34" fill="#f4f4f4" stroke="#999"/>
<text x="690" y="404" font-size="12" fill="#555" text-anchor="middle">OFF — draining; stays OFF until the level falls below 10 %</text>

<line x1="110" y1="440" x2="960" y2="440" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
<text x="950" y="460" font-size="12" fill="#333" text-anchor="end">time</text>

<text x="110" y="494" font-size="12" fill="#888">Only one switch event per crossing of the band. A single setpoint at 50 % would toggle on every ripple.</text>
</svg>
